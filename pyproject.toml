[project]
name = "prosaic-castle"
version = "3.4.2"
description = "Prosaic Castle — independent read-only LanceDB memory provider, FTS-first by default."
readme = "PROSAIC_CASTLE.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "ai", "memory", "llm", "rag", "mcp",
    "vector-database", "claude", "lancedb", "embeddings", "verbatim",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "lancedb>=0.20",
    "pyarrow>=14.0",
    "pyyaml>=6.0,<7",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
castle      = "cognitive_castle.cli:main"
castle-mcp  = "cognitive_castle.mcp_server:main"
castle-provider = "cognitive_castle.provider_worker:main"
prosaic-castle-provider = "prosaic_castle.provider_worker:main"

[project.entry-points."cognitive_castle.backends"]
lancedb = "cognitive_castle.backends.lancedb_backend:LanceDBBackend"

[project.entry-points."cognitive_castle.sources"]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0"]
legacy = ["sentence-transformers>=3.0", "spacy>=3.0.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff==0.17.1", "psutil>=5.9"]
spellcheck = ["autocorrect>=2.0"]
gpu    = ["onnxruntime-gpu>=1.16"]
dml    = ["onnxruntime-directml>=1.16"]
coreml = ["onnxruntime>=1.16"]

[dependency-groups]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff==0.17.1", "psutil>=5.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["cognitive_castle", "prosaic_castle"]

[tool.hatch.build.targets.sdist]
# Bundle hashes live in the repository; embedding them would make the archive
# depend on its own digest. Runtime source and legacy archive contents remain.
exclude = ["/pilot/candidate.json"]

[tool.ruff]
required-version = "==0.15.12"
line-length = 100
target-version = "py39"
extend-exclude = ["benchmarks", "cognitive_castle/understanding", "cognitive_castle/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "C901"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not benchmark and not slow and not stress'"
markers = [
    "benchmark: scale/performance benchmark tests",
    "slow: tests that take more than 30 seconds",
    "stress: destructive scale tests (100K+ drawers)",
    "soar: tests requiring Soar 9.6+ + SML Python bindings (auto-skip if unavailable)",
]

[tool.coverage.run]
source = ["cognitive_castle"]
relative_files = true
# Vendored upstream package; Castle's adapter and integration tests remain measured.
omit = ["cognitive_castle/understanding/*", "cognitive_castle/_vendor/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]
