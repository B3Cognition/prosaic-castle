[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cognitive-castle-sue"
version = "0.1.0"
description = "Model-free, dependency-free Castle SUE dialectic engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = []
dependencies = []

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/castle_sue"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml", "/hatch_build.py", "/source-manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
